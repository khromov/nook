services:
  nook:
    build:
      context: .
      args:
        # Set to true to serve models from same origin instead of CDN.
        # Download models first: node scripts/download-models.js
        PUBLIC_LOCAL_MODE: 'true'
    ports:
      - '3000:3000'
    volumes:
      # Mount the downloaded models directory into the container.
      - ./local-models:/app/local-models
